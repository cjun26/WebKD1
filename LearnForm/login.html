<html>
<head>
    <title> Login system</title>
</head>
<body>
    <form
        action="https://tranduythanh.com/process.html"
        method="get"
        
    >
    <h1> Login system</h1>
    <table>
        <tr>
            <td>
                <label for="username">Username:</label>
            </td>
            <td><input type="text" name="username" id="username"></td> <!--các input nên để name và id giống nhau để dễ dàng lấy dữ liệu -->
        </tr>
        <tr>
            <td>
                <label for="password">Password:</label>
            </td>
            <td><input type="password" name="password" id="password"></td>
        </tr>
        <tr>
            <td> &nbsp;</td>
            <td> 
                <input type="checkbox" name="remember" id="remember">
                <label for="remember"> Remember me</label>
            </td>
        </tr>
        <tr>
            <td > <input type="submit" value="Login"></td>
        </tr>
    </table>
    </form>
</body>
</html>
