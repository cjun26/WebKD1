<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        background-color: #cbffff;
    }
    .header{
        display: flex;
        justify-content: center;
    }
    </style>
</head>
<body>
    <form>
        <div class=header>
            <img class="logo" src="Hinh/DeLong.jpg" alt="DeLong Enterprises">
        </div>

        <h2>Travel Expense Report</h2>
        <hr>
        
        <label>1) First Name:<input type="text" name="first-name"></label>
        <label>Last Name:<input type="text" name="last-name"></label>

        <label>
            <p>
                2) Social Security Number:
                <input class="ssn-input" type="text" name="ssn">
            </p>
        </label>

        <label>
            <p>3) Department:
                <select name="department">
                <option>Accounting</option>
                <option>Sales</option>
                <option>Marketing</option>
                <option>Information Technology</option>
                <option>Human Resources</option>
            </select>
            </p>
        </label>
            
        <p>4) Describe the purpose of your trip.</p>
        <textarea name="purpose" rows="10" cols="60"></textarea>

        <p>5) Itemize your travel expenses</p>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" name="date-1" placeholder="mm/dd/yy"></td>
                        <td><input type="text" name="description-1"></td>
                        <td>
                            <select name="category-1">
                                <option>Meal</option>
                                <option>Hotel</option>
                                <option>Transport</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="amount-1"></td>
                    </tr>
                    <tr>
                        <td><input type="text" name="date-2" placeholder="mm/dd/yy"></td>
                        <td><input type="text" name="description-2"></td>
                        <td>
                            <select name="category-2">
                                <option>Meal</option>
                                <option>Hotel</option>
                                <option>Transport</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="amount-2"></td>
                    </tr>
                    <tr>
                        <td><input type="text" name="date-3" placeholder="mm/dd/yy"></td>
                        <td><input type="text" name="description-3"></td>
                        <td>
                            <select name="category-3">
                                <option>Meal</option>
                                <option>Hotel</option>
                                <option>Transport</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="amount-3"></td>
                    </tr>
                    <tr>
                        <td><input type="text" name="date-4" placeholder="mm/dd/yy"></td>
                        <td><input type="text" name="description-4"></td>
                        <td>
                            <select name="category-4">
                                <option>Meal</option>
                                <option>Hotel</option>
                                <option>Transport</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td><input type="text" name="amount-4"></td>
                    </tr>
                </tbody>
            </table>

            <p>
                6) Have you submitted your receipts?
                <label><input type="radio" name="receipts" value="yes">Yes</label>
                <label><input type="radio" name="receipts" value="no">No</label>
            </p>

            <div class="button">
                <input type="submit" name="submit" value="Click to register" class="button1">
                <input type="reset" name="reset" value="Click to cancel">
            </div>

            <p><i>Questions? Contact Debbie Larson in Accounting (ext. 2150)</i>.</p>
    </form>

    
</body>
</html>
